[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-harness"
version = "1.0.0"
description = "A local, model-agnostic Coding Agent MVP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.37,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_harness = ["website_runtime_smoke.js"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
addopts = "-q"
markers = [
  "integration: deterministic Harness integration tests",
]
