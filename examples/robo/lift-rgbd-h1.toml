# Copy to .vibe/config.toml from the repository root. Inherit the existing model/provider.
[[mcp_servers]]
name = "robo-mujoco"
transport = "stdio"
command = "uv"
args = ["run", "--no-sync", "robo-sim-mcp"]
sampling_enabled = false
startup_timeout_sec = 60.0
tool_timeout_sec = 120.0
disabled_tools = ["robo_devices", "robo_connect", "robo_arm", "robo_disarm", "robo_observe", "robo_verify", "robo_execute", "robo_stop", "robo_disconnect"]
[mcp_servers.env]
ROBO_SIM_OBSERVATION_MODE = "rgbd"
ROBO_SIM_GEOMETRY_LIBRARY = "h1-v8-v9"
